name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest, PostGIS 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: simlahan
          POSTGRES_USER: simlahan
          POSTGRES_PASSWORD: simlahan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simlahan -d simlahan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgis://simlahan:simlahan@localhost:5432/simlahan
      DEBUG: "1"
      SECRET_KEY: ci-only-insecure-key
      # Test-only Fernet key (not a secret): base64 of 32 zero bytes.
      FIELD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - uses: actions/checkout@v7

      - name: Install GDAL, GEOS, PROJ and gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev gettext tesseract-ocr

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile translations
        run: python manage.py compilemessages -l id -v0

      - name: Lint (flake8, black, isort)
        run: |
          flake8 .
          black --check .
          isort --check-only .

      - name: Check migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      # Tes memakai --nomigrations, jadi jalankan migrasi sungguhan (termasuk
      # RunPython dengan model historis), bootstrap, dan data contoh seperti
      # saat kontainer backend dimulai di server.
      - name: Apply migrations, bootstrap and sample data on a real database
        env:
          DJANGO_SUPERUSER_USERNAME: admin
          DJANGO_SUPERUSER_EMAIL: admin@example.invalid
          DJANGO_SUPERUSER_PASSWORD: ci-only-Admin-123
        run: |
          python manage.py migrate --noinput
          python manage.py createcachetable
          python manage.py simlahan_bootstrap
          python manage.py simlahan_bootstrap
          for module in pengadaan alokasi asetlahan operasi; do
            python manage.py "${module}_contoh_rempang"
            python manage.py "${module}_contoh_rempang"
          done
          python manage.py pengguna_contoh
          python manage.py pengguna_contoh
          python manage.py pengguna_contoh --hapus

      - name: Run all backend tests
        run: pytest -p no:cacheprovider

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          # Yarn cache is handled below, after Corepack provides yarn 4.
          package-manager-cache: false

      - name: Enable Corepack (yarn 4)
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn vitest run

  docker:
    name: Docker stack (production settings)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Sama seperti server produksi: DEBUG=0, cookie aman, port hanya di
      # 127.0.0.1 di belakang reverse proxy HTTPS (2 proxy di depan backend).
      - name: Write production-like .env
        run: |
          cp .env.example .env
          set_env() { sed -i "s|^$1=.*|$1=$2|" .env; grep -q "^$1=$2$" .env; }
          set_env POSTGRES_PASSWORD "$(openssl rand -hex 24)"
          set_env SECRET_KEY "$(openssl rand -hex 40)"
          set_env FIELD_ENCRYPTION_KEY "$(openssl rand -base64 32 | tr '+/' '-_')"
          set_env ALLOWED_HOSTS simlahan.example.id,localhost
          set_env CSRF_TRUSTED_ORIGINS https://simlahan.example.id
          set_env SESSION_COOKIE_SECURE 1
          set_env CSRF_COOKIE_SECURE 1
          set_env HTTP_PORT 127.0.0.1:18100
          set_env TRUSTED_PROXY_COUNT 2
          set_env DJANGO_SUPERUSER_PASSWORD "Ci-$(openssl rand -hex 12)"
          set_env OFFICER_UI_URL https://simlahan.example.id

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait until the site answers through the frontend
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS -H "Host: simlahan.example.id" http://127.0.0.1:18100/healthz; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Smoke test pages as served by nginx
        run: |
          check() {
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Host: simlahan.example.id" -H "X-Forwarded-Proto: https" \
              "http://127.0.0.1:18100$1")
            echo "$1 -> $code"
            [ "$code" = "$2" ]
          }
          check / 200
          check /sewa 200
          check /healthz 200
          check /readiness 200
          check /admin/login/ 200
          check /portal/ 200
          check /portal/lahan/ 200
          check /portal/layanan/ 200
          check /portal/kalkulator-uwt/ 200
          check /komando/ 302
          check /aset/lapangan/ 302
          check /akun/panduan/ 302
          check /akun/sandi/ 302
          check /static/admin/css/base.css 200
          check /v1/ 401
          check /halaman-tidak-ada/ 200
          check /portal/halaman-tidak-ada/ 404

      - name: Every service is running
        run: |
          docker compose ps
          for service in db backend qcluster batchrun frontend; do
            test "$(docker compose ps --status running -q "$service" | wc -l)" = 1
          done

      - name: Production checks, sample data and a restart
        run: |
          docker compose exec -T backend python manage.py check --deploy
          for module in pengadaan alokasi asetlahan operasi; do
            docker compose exec -T backend python manage.py "${module}_contoh_rempang"
          done
          docker compose exec -T backend python manage.py pengguna_contoh
          docker compose exec -T backend python manage.py pengadaan_cek_tenggat
          docker compose exec -T backend python manage.py alokasi_pemantauan
          docker compose exec -T backend python manage.py asetlahan_pengingat
          docker compose exec -T backend python manage.py operasi_harian
          # Deploy menghentikan kontainer lama: harus berhenti rapi, bukan
          # menunggu batas 10 detik lalu dibunuh paksa.
          started=$(date +%s)
          docker compose stop backend qcluster batchrun
          elapsed=$(( $(date +%s) - started ))
          echo "stopped in ${elapsed}s"
          test "$elapsed" -lt 9
          docker compose up -d
          for attempt in $(seq 1 60); do
            curl -fsS -H "Host: simlahan.example.id" http://127.0.0.1:18100/healthz && exit 0
            sleep 5
          done
          exit 1

      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
