{% if page.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Halaman">
  {% if page.has_previous %}<a class="btn btn-outline btn-small" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page.previous_page_number }}">‹ Sebelumnya</a>{% endif %}
  <span class="muted small">Halaman {{ page.number }} dari {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn-outline btn-small" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page.next_page_number }}">Berikutnya ›</a>{% endif %}
</nav>
{% endif %}
