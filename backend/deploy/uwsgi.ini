[uwsgi]
http-socket = :8080
chdir = /app
module = mvj.wsgi
static-map = /static=/app/static
buffer-size = 32768
master = 1
; SIGTERM (docker stop / compose up saat deploy) menghentikan uWSGI dengan rapi,
; bukan memuat ulang lalu dibunuh paksa setelah 10 detik.
die-on-term = true
processes = 4
threads = 4
; Batas waktu request 300 detik (sama dengan proxy_read_timeout nginx):
; request yang menggantung (PDF/OCR jahat, panggilan AI/WhatsApp lambat)
; dihentikan paksa agar 16 thread worker tidak habis digantung selamanya.
harakiri = 300
harakiri-verbose = true
; Enable threads (as requested by sentry-sdk)
enable-threads = true
; Call uwsgi_fork_hook when forking a new worker process (for sentry-sdk)
py-call-uwsgi-fork-hooks = true
; don't log readiness and healthz endpoints
route = ^/readiness$ donotlog:
route = ^/healthz$ donotlog:
; headers
add-header = X-Content-Type-Options: nosniff

; Disable write exception reporting to avoid unnecessary Sentry noise about this non-issue.
; Source: https://stumbles.id.au/how-to-fix-uwsgi-oserror-write-error.html
disable-write-exception = true
