{% load l10n %}{% load alokasi_tags %}{% for b in bars %}
<div class="al-bar"><span>{{ b.label }}</span><span class="al-bar-track"><span class="al-bar-fill" style="display:block;width:{{ b.pct|unlocalize }}%;background:{{ b.color }}"></span></span><span class="al-num">{% if fmt == "rupiah" %}{{ b.value|rupiah }}{% elif fmt == "luas" %}{{ b.value|angka:2 }} m²{% else %}{{ b.value|angka }}{% endif %}</span></div>
{% empty %}<p class="al-muted">Belum ada data.</p>{% endfor %}
