<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}{% endblock %} · {{ app_name|default:"SimLahan" }}</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; color: #1f2933; }
    main { max-width: 520px; width: 100%; background: #fff; border: 1px solid #dde3ea; border-radius: 12px; padding: 28px 24px; }
    .code { font-size: 14px; font-weight: 700; letter-spacing: .08em; color: #0b4f8a; margin: 0 0 4px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 16px; color: #52606d; }
    a { color: #0b4f8a; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #e2e8f0; }
      main { background: #111827; border-color: #1f2937; }
      p { color: #94a3b8; } .code, a { color: #60a5fa; }
    }
  </style>
</head>
<body>
  <main>
    <p class="code">{% block code %}{% endblock %} · {{ app_name|default:"SimLahan" }}</p>
    <h1>{% block heading %}{% endblock %}</h1>
    <p>{% block message %}{% endblock %}</p>
    <div class="actions"><a href="javascript:history.back()">‹ Kembali</a><a href="/portal/">Beranda portal</a><a href="/admin/">Panel petugas</a></div>
  </main>
</body>
</html>
